<script>
// CS1 Python hub content. L[id] = lesson. Quiz items: [stem, code, [correct, wrong, wrong, wrong], explanation]
const L={};

L["2.1"]={t:"Introduction to Programming With Karel",cmu:[],
eq:["How do we give a computer exact instructions?","Why must commands be written in a precise order?"],
short:["Karel is a dog who lives in a grid world and follows only four basic commands.","Commands must be spelled exactly, with parentheses: move(), turn_left(), put_ball(), take_ball().","Karel does exactly what you say, in order, nothing more."],
secs:[
{h:"Karel's world",p:"<p>Karel's world is a grid. Rows are called <strong>streets</strong> and columns are called <strong>avenues</strong>. Karel starts facing a direction (usually east) and can carry an unlimited bag of tennis balls. Walls block Karel's way.</p>",
code:`move()
move()
put_ball()
move()`,
logic:["Karel moves forward one space, twice.","Karel puts one ball down on the current square.","Karel moves forward once more. The ball stays behind on the square where it was placed."]},
{h:"The four commands",p:"<p>A <strong>command</strong> is an instruction Karel already knows. Each one is a function call, so it needs parentheses.</p><table><tr><th>Command</th><th>What Karel does</th></tr><tr><td><code>move()</code></td><td>moves one square forward</td></tr><tr><td><code>turn_left()</code></td><td>turns 90° to the left</td></tr><tr><td><code>put_ball()</code></td><td>puts one ball on the square</td></tr><tr><td><code>take_ball()</code></td><td>picks up one ball from the square</td></tr></table>",
code:`# Karel picks up a ball two spaces ahead and brings it back
move()
move()
take_ball()
turn_left()
turn_left()
move()
move()`,
logic:["Two moves get Karel to the ball.","Two left turns make Karel face the opposite direction.","Two moves bring Karel back to the start, carrying the ball."]}],
mistakes:["Forgetting the parentheses: <code>move</code> instead of <code>move()</code>.","Capital letters or spaces: <code>Move()</code> or <code>turn left()</code> are errors.","Moving into a wall or taking a ball from an empty square makes Karel crash."],
check:["Karel faces east. Which commands make Karel face north?","One <code>turn_left()</code>. Turning left from east points north."],
quiz:[
["Which is a correct Karel command?","",["move()","Move()","move","move(1)"],"Commands are lowercase and need empty parentheses."],
["Karel faces east. After turn_left() twice, which way does Karel face?","",["West","North","South","East"],"Each left turn is 90°. Two turns from east point west."],
["What happens if Karel tries to move() into a wall?","",["Karel crashes and the program stops with an error","Karel turns around automatically","Karel stays in place and keeps running","Karel jumps over the wall"],"Karel can't move through walls; the program ends with an error."],
["What does take_ball() do on a square with 3 balls?","",["Removes 1 ball, leaving 2","Removes all 3 balls","Adds 1 ball","Nothing"],"Each take_ball() removes exactly one ball."]]};

L["2.2"]={t:"More Basic Karel",cmu:[],
eq:["How do we plan a sequence of commands to reach a goal?","How can we predict exactly where Karel ends up?"],
short:["Trace programs by tracking Karel's position and direction after every command.","Rows are streets; columns are avenues.","Draw the world and simulate each step on paper."],
secs:[
{h:"Tracing a program",p:"<p>Before running, predict the result. Keep track of three things: <strong>position</strong>, <strong>direction</strong>, and <strong>balls</strong>.</p>",
code:`# Karel starts at street 1, avenue 1, facing east
move()          # (1, 2) facing east
turn_left()     # (1, 2) facing north
move()          # (2, 2) facing north
put_ball()      # one ball at (2, 2)
turn_left()     # facing west
move()          # (2, 1) facing west`,
logic:["Write the position and direction next to each line as a comment.","turn_left changes direction but not position.","At the end, Karel is at street 2, avenue 1, facing west, and one ball is at (2, 2)."]},
{h:"Building a pattern",p:"<p>Many tasks repeat the same few commands. Notice the pattern before writing code; later you'll use functions and loops to avoid repeating.</p>",
code:`# Put a ball on the next three squares
move()
put_ball()
move()
put_ball()
move()
put_ball()`,
logic:["The pair move() then put_ball() repeats three times.","Repeated code is a sign that a loop (2.9) or function (2.4) would help.","Count the moves carefully: Karel must not run into the wall at the end of the row."]}],
mistakes:["Confusing streets (rows) and avenues (columns).","Losing track of Karel's direction after turns.","Not counting how many squares are in a row before moving."],
check:["Karel starts at (1, 1) facing east and runs move(), move(), turn_left(), move(). Where is Karel?","At street 2, avenue 3, facing north."],
quiz:[
["In Karel's world, what is a street?","",["A row","A column","A wall","A ball"],"Streets run left to right (rows); avenues run up and down (columns)."],
["Karel starts at (1, 1) facing east. After move(), turn_left(), move(), where is Karel?","",["Street 2, avenue 2","Street 1, avenue 3","Street 2, avenue 1","Street 3, avenue 1"],"The first move goes to avenue 2; after turning north, the second move goes up to street 2."],
["Which command changes Karel's direction but not position?","",["turn_left()","move()","put_ball()","take_ball()"],"Only turning changes direction."],
["Why should you trace a program before running it?","",["To predict what will happen and catch mistakes early","Because Karel won't run otherwise","To make the program faster","To add more balls"],"Tracing helps you find errors before Karel crashes."]]};

L["2.3"]={t:"Karel Can't Turn Right",cmu:["2"],
eq:["How can we build new behavior out of commands we already have?","Why is defining a function better than repeating code?"],
short:["Three left turns equal one right turn.","Define turn_right() once and use it anywhere.","Defining new commands is the first step toward functions."],
secs:[
{h:"Making a right turn",p:"<p>Karel only knows <code>turn_left()</code>. Turning left three times (270°) ends up facing the same way as one right turn (90°).</p>",
code:`def turn_right():
    turn_left()
    turn_left()
    turn_left()

move()
turn_right()
move()`,
logic:["<code>def</code> defines a new command named turn_right.","The indented lines are its body: three left turns.","After it's defined, <code>turn_right()</code> is called just like a built-in command."]},
{h:"Turning around",p:"<p>Using the same idea, two left turns make Karel face the opposite way.</p>",
code:`def turn_around():
    turn_left()
    turn_left()

def turn_right():
    turn_left()
    turn_left()
    turn_left()

turn_around()
move()`,
logic:["Each new command is defined once.","The function definitions come before they are used.","Code that uses these commands reads more like English."]}],
mistakes:["Forgetting the colon after <code>def turn_right()</code>.","Not indenting the body.","Calling the function before it is defined."],
check:["How many turn_left() calls does turn_around() need?","Two: 90° + 90° = 180°."],
quiz:[
["How many left turns equal one right turn?","",["3","1","2","4"],"270° to the left points the same way as 90° to the right."],
["What keyword starts a function definition in Python?","",["def","function","define","func"],"Python functions begin with def."],
["What is wrong with this code?",`def turn_right()
    turn_left()
    turn_left()
    turn_left()`,["The colon is missing after turn_right()","turn_left() can't be used in a function","There should be four turn_left() calls","Nothing is wrong"],"A def line must end with a colon."],
["After defining turn_right(), how do you use it?","",["Write turn_right()","Write def turn_right()","Write turn_right","Write call turn_right"],"Call a function by its name followed by parentheses."]]};

L["2.4"]={t:"Functions in Karel",cmu:["2"],
eq:["What is a function, and how does it make code easier to read?","How do we name functions so the code explains itself?"],
short:["A function is a named group of commands.","Define with def name(): and an indented body; call with name().","Good names describe what the function does (verb phrases)."],
secs:[
{h:"Defining and calling",p:"<p>Defining a function teaches Karel a new command. <strong>Calling</strong> it runs the commands inside. A function can be called many times.</p>",
code:`def build_tower():
    put_ball()
    turn_left()
    move()
    put_ball()
    move()
    put_ball()

build_tower()
move()
build_tower()`,
logic:["build_tower() is defined once and called twice.","Each call runs all six lines of its body.","If you call it before defining it, Python reports a NameError."]},
{h:"Naming and indentation",p:"<p>Python uses <strong>indentation</strong> (4 spaces) to know which lines belong to the function. Names use lowercase with underscores (snake_case).</p>",
code:`def jump_hurdle():      # good name: says what it does
    turn_left()
    move()
    turn_right()
    move()
    turn_right()
    move()
    turn_left()

def x():                # bad name: tells nothing`,
logic:["Lines indented under def are the body.","The first line that isn't indented ends the function.","A clear name makes the main code read like a story."]}],
mistakes:["Inconsistent indentation (mixing 2 and 4 spaces).","Defining a function but never calling it.","Using spaces or capitals in names: <code>Build Tower</code>."],
check:["What is the difference between defining and calling a function?","Defining (def) creates the command; calling (name()) runs it."],
quiz:[
["How many times can a function be called after it is defined?","",["As many times as needed","Only once","Exactly twice","Only inside another function"],"Defining once and calling many times is the point of functions."],
["How does Python know which lines belong to a function?","",["Indentation","Curly braces","Semicolons","The word end"],"Indented lines under the def line form the body."],
["Which is the best function name?","",["climb_stairs","cs","Climb Stairs","function1"],"Lowercase with underscores, describing the action."],
["What happens when this runs?",`move()
spin()

def spin():
    turn_left()
    turn_left()
    turn_left()
    turn_left()`,["An error, because spin() is called before it is defined","Karel spins in a full circle","Karel moves and does nothing else, with no error","Karel turns right"],"Python runs top to bottom; spin doesn't exist yet when it is called."]]};

L["2.5"]={t:"Top Down Design and Decomposition in Karel",cmu:["3"],
eq:["How do we break a big problem into smaller ones?","How does a main function organize a program?"],
short:["Decomposition: split a problem into smaller sub-problems.","Top-down design: write the big steps first as function calls, then define each one.","Each function should do one clear job."],
secs:[
{h:"Start from the big picture",p:"<p>Describe the solution as a few big steps. Each step becomes a function. Then write each function, breaking it down further if needed.</p>",
code:`# Task: Karel collects a pile of balls and brings them home
def main():
    go_to_pile()
    pick_up_all()
    return_home()

def go_to_pile():
    move()
    move()

def pick_up_all():
    take_ball()
    take_ball()
    take_ball()

def return_home():
    turn_around()
    move()
    move()

def turn_around():
    turn_left()
    turn_left()

main()`,
logic:["main() reads like the plan: go, pick up, return.","Each helper function handles one step.","main() is called on the last line, after every function is defined, so all names exist when it runs."]},
{h:"Why decomposition helps",p:"<p>Small functions are easier to write, test, and fix. If Karel ends in the wrong place, you know which function to check.</p>",
code:`# Planting a row of 4 "flowers": same step repeated
def plant():
    put_ball()
    move()

def main():
    plant()
    plant()
    plant()
    put_ball()

main()`,
logic:["plant() solves one small piece.","main() combines the pieces.","The last put_ball() avoids moving into the wall after the final flower."]}],
mistakes:["Writing everything in one long block.","Functions that do several unrelated things.","Forgetting to call main()."],
check:["In top-down design, what do you write first?","The main steps, as calls to functions that you define afterward."],
quiz:[
["What is decomposition?","",["Breaking a problem into smaller parts","Deleting unused code","Running a program backward","Adding comments"],"Decomposition splits a large task into manageable sub-tasks."],
["In top-down design, which comes first?","",["The overall plan as function calls","The smallest details","Testing every command","Choosing colors"],"Start with the big steps and fill in details later."],
["Why put main() as the last line?","",["So every function is defined before main runs","Because main must always be last alphabetically","Python requires all code to be in main","It makes Karel faster"],"Python needs functions defined before they are called."],
["A good function should:","",["Do one clear job","Do as many things as possible","Have a one-letter name","Never call other functions"],"Small, focused functions are easier to test and reuse."]]};

L["2.6"]={t:"Commenting Your Code",cmu:["1"],
eq:["Who reads our code besides the computer?","What makes a comment useful?"],
short:["Comments start with # and are ignored by Python.","Multi-line descriptions (docstrings) use triple quotes.","Explain why and what, not every single line."],
secs:[
{h:"Writing comments",p:"<p>Comments help people (including future you) understand the program. Python skips them when running.</p>",
code:`"""
Program: Hurdles
Karel jumps over 3 hurdles and stops at the end.
"""

# Turns Karel to the right using three left turns
def turn_right():
    turn_left()
    turn_left()
    turn_left()

def jump_hurdle():
    """Karel goes up, over, and down one hurdle."""
    turn_left()
    move()
    turn_right()
    move()
    turn_right()
    move()
    turn_left()`,
logic:["The triple-quoted block at the top describes the whole program.","Each function gets a short description of what it does.","Comments don't change what Karel does."]},
{h:"Good vs. weak comments",p:"<p>A good comment explains the purpose. A weak comment repeats what the code already says.</p>",
code:`move()   # move            <- weak: says nothing new

# Skip the first square because it already has a ball   <- useful
move()`,
logic:["Explain intent and anything surprising.","Keep comments up to date when code changes.","Use comments to plan: write the steps as comments, then fill in code."]}],
mistakes:["Commenting every line with what it obviously does.","Leaving outdated comments after changing code.","Forgetting the # so Python tries to run the text."],
check:["What character starts a single-line comment in Python?","The hash sign: #"],
quiz:[
["What does Python do with comments?","",["Ignores them when running","Prints them","Runs them as commands","Turns them into functions"],"Comments are for humans only."],
["Which is a single-line comment in Python?","",["# go to the wall","// go to the wall","<!-- go to the wall -->","/* go to the wall */"],"Python uses #."],
["Which comment is most useful?","",["# Stop one square early so Karel doesn't hit the wall","# move","# this is code","# Karel"],"It explains the reason behind the code."],
["What are triple quotes (\"\"\") often used for?","",["Describing a program or function in several lines","Making Karel turn","Ending a function","Repeating code"],"Docstrings describe programs and functions."]]};

L["2.7"]={t:"Abstraction",cmu:["2"],
eq:["How can we use something without knowing how it works inside?","How do functions hide details?"],
short:["Abstraction means managing complexity by hiding details.","Once turn_right() works, you use it without thinking about the three left turns.","Built-in commands like move() are abstractions too."],
secs:[
{h:"Hiding the details",p:"<p>When you call <code>jump_hurdle()</code>, you think \"jump\", not \"turn left, move, turn right…\". The details are hidden inside the function. That is <strong>abstraction</strong>.</p>",
code:`def run_race():
    jump_hurdle()
    jump_hurdle()
    jump_hurdle()

# The reader sees the big idea.
# The details live inside jump_hurdle() and turn_right().
run_race()`,
logic:["run_race is built from jump_hurdle, which is built from turn_right, which is built from turn_left.","Each layer hides the one below it.","You can change how jump_hurdle works without changing run_race."]},
{h:"Abstraction everywhere",p:"<p>Real-world examples: driving a car without knowing how the engine works; using <code>print()</code> without knowing how text reaches the screen.</p>",
code:`print("Hello")   # you don't need to know how print works inside
move()           # or how Karel's move is programmed`,
logic:["Abstraction lets us build big programs from small, trusted pieces.","You only need to know what a function does, its inputs, and its result.","This idea returns in Python functions (Module 9)."]}],
mistakes:["Thinking abstraction means removing code (it means hiding details behind a name).","Functions with unclear names, which break the abstraction.","Copying code instead of reusing a function."],
check:["Give one example of abstraction from Karel.","turn_right(): you use it without thinking about the three left turns inside."],
quiz:[
["Abstraction in programming means:","",["Hiding details so you can focus on the big idea","Deleting comments","Writing all code in one function","Making code longer"],"Abstraction manages complexity by hiding details."],
["Which is an example of abstraction?","",["Calling turn_right() without thinking about the left turns inside","Writing turn_left() three times every time","Removing all functions","Using only move()"],"The function name stands for the details."],
["If you change how jump_hurdle() works inside, what happens to code that calls it?","",["It doesn't need to change as long as the function still does the same job","It must be rewritten","It stops working","Karel forgets the function"],"Callers depend only on what the function does."],
["Which everyday example is most like abstraction?","",["Using a microwave without knowing how it heats food","Building a microwave from parts","Reading a microwave's circuit diagram","Repairing a microwave"],"You use it through a simple interface."]]};

L["2.8"]={t:"Super Karel",cmu:[],
eq:["How do libraries give us new tools for free?","When should we use built-in functions instead of writing our own?"],
short:["Super Karel already knows turn_right() and turn_around().","Built-in functions save time, like a library.","Don't redefine commands that already exist."],
secs:[
{h:"New built-in commands",p:"<p>Super Karel comes with extra commands. You no longer need to define them.</p>",
code:`# Super Karel
move()
turn_right()      # built in
move()
turn_around()     # built in
move()`,
logic:["turn_right and turn_around now work without a def.","These come from a library of ready-made commands.","Programs get shorter and clearer."]},
{h:"Libraries in real programming",p:"<p>Python has libraries too, like <code>math</code> and <code>random</code>. Programmers reuse them instead of rewriting common tools.</p>",
code:`import random
roll = random.randint(1, 6)   # a ready-made function from a library
print(roll)`,
logic:["import brings in the library.","You use its functions through their names.","This is the same idea as Super Karel's built-in commands."]}],
mistakes:["Defining turn_right() again in Super Karel (unnecessary).","Using Super Karel commands in a regular Karel world, where they don't exist.","Forgetting that new commands still need parentheses."],
check:["Name two commands Super Karel knows that basic Karel doesn't.","turn_right() and turn_around()."],
quiz:[
["Which command is built into Super Karel but not basic Karel?","",["turn_right()","move()","put_ball()","turn_left()"],"Super Karel adds turn_right() and turn_around()."],
["Why use built-in commands?","",["They save time and are already tested","They make programs longer","They are required in every program","They run only once"],"Reusing tested tools is efficient."],
["What does turn_around() do?","",["Turns Karel 180°","Turns Karel 90° right","Moves Karel back one square","Spins Karel 360°"],"Turning around faces the opposite direction."],
["In Python, how do you use a library such as random?","",["import random","def random():","use random","include random"],"import loads a library module."]]};

L["2.9"]={t:"For Loops",cmu:["7"],
eq:["How can we repeat code a fixed number of times?","When should we use a for loop?"],
short:["for i in range(n): repeats the indented body n times.","Use a for loop when you know exactly how many times to repeat.","Loops remove repeated lines of code."],
secs:[
{h:"Repeating a fixed number of times",p:"<p><code>range(4)</code> produces 0, 1, 2, 3: four values, so the body runs four times.</p>",
code:`# Put 10 balls on one square
for i in range(10):
    put_ball()

# Walk around a 4-sided square
for i in range(4):
    move()
    move()
    turn_left()`,
logic:["The colon and indentation mark the loop body.","range(10) repeats 10 times; range(4) repeats 4 times.","Everything indented under the for line repeats; the next unindented line runs after the loop."]},
{h:"Loops with functions",p:"<p>Combine loops and functions to solve repetitive tasks cleanly.</p>",
code:`def jump_hurdle():
    turn_left()
    move()
    turn_right()
    move()
    turn_right()
    move()
    turn_left()

for i in range(5):
    move()
    jump_hurdle()`,
logic:["One loop replaces ten lines of calls.","Changing 5 to 8 handles 8 hurdles.","Loops and functions work together: functions name the step, loops repeat it."]}],
mistakes:["Forgetting the colon or indentation.","Putting a command inside the loop that should run once.","Using a for loop when the number of repeats isn't known (use while, 2.12)."],
check:["How many balls does this put down? for i in range(3): put_ball(); put_ball()","6 if both are indented (3 × 2); 4 if only the first is indented (3 + 1)."],
quiz:[
["How many times does the body run?",`for i in range(7):
    move()`,["7","6","8","1"],"range(7) gives 7 values: 0 through 6."],
["How many balls are placed?",`for i in range(3):
    put_ball()
    put_ball()`,["6","3","2","5"],"Both lines are indented: 3 × 2 = 6."],
["How many balls are placed?",`for i in range(3):
    move()
put_ball()`,["1","3","0","4"],"put_ball() is not indented, so it runs once after the loop."],
["When is a for loop the best choice?","",["When you know exactly how many times to repeat","When you repeat until a wall is reached","When you never repeat","When checking a condition once"],"for loops repeat a known number of times."]]};

L["2.10"]={t:"If Statements",cmu:["3"],
eq:["How can a program make decisions?","How does Karel sense the world?"],
short:["if condition: runs the body only when the condition is true.","Karel's conditions: front_is_clear(), balls_present(), facing_north(), and more.","Conditions let one program work in different worlds."],
secs:[
{h:"Making decisions",p:"<p>A condition is a question with a yes/no (True/False) answer. Karel can check its surroundings.</p><table><tr><th>Condition</th><th>Opposite</th></tr><tr><td><code>front_is_clear()</code></td><td><code>front_is_blocked()</code></td></tr><tr><td><code>left_is_clear()</code></td><td><code>left_is_blocked()</code></td></tr><tr><td><code>right_is_clear()</code></td><td><code>right_is_blocked()</code></td></tr><tr><td><code>balls_present()</code></td><td><code>no_balls_present()</code></td></tr><tr><td><code>facing_north()</code></td><td><code>not_facing_north()</code></td></tr></table>",
code:`if front_is_clear():
    move()

if balls_present():
    take_ball()`,
logic:["Karel moves only if there's no wall ahead, so it never crashes.","Karel takes a ball only if one is there.","If the condition is false, the indented body is skipped."]},
{h:"Using not",p:"<p><code>not</code> flips a condition. <code>if not balls_present():</code> means \"if there are no balls\".</p>",
code:`# Make sure every square in a row of 5 has exactly one ball
for i in range(5):
    if not balls_present():
        put_ball()
    if front_is_clear():
        move()`,
logic:["Karel adds a ball only where one is missing.","The second if prevents crashing at the end of the row.","The same program works no matter which squares already had balls."]}],
mistakes:["Forgetting the parentheses on conditions: <code>if front_is_clear:</code>.","Forgetting the colon.","Using if when the action must repeat (that's a while loop)."],
check:["Write a statement so Karel picks up a ball only if one is there.","if balls_present():<br>&nbsp;&nbsp;&nbsp;&nbsp;take_ball()"],
quiz:[
["What does an if statement do?","",["Runs code only when a condition is true","Repeats code forever","Defines a new command","Always runs its body"],"if checks once and runs the body only if True."],
["Which condition is True when there is no wall in front of Karel?","",["front_is_clear()","front_is_blocked()","no_balls_present()","facing_north()"],"Clear means no wall."],
["What does this do on a square with no balls?",`if balls_present():
    take_ball()
put_ball()`,["Puts down one ball","Crashes","Takes a ball","Does nothing"],"The if body is skipped; put_ball() always runs."],
["Which line correctly checks for no balls?","",["if not balls_present():","if balls_present() == none:","if no balls_present:","if not balls_present:"],"not flips the condition; the condition needs parentheses."]]};

L["2.11"]={t:"If/Else Statements",cmu:["4"],
eq:["How does a program choose between two actions?","How do we make sure exactly one action happens?"],
short:["if/else runs one block when True, the other when False.","Exactly one of the two blocks always runs.","else has no condition of its own."],
secs:[
{h:"Two-way decisions",p:"<p>Use <code>else</code> when Karel must do one thing or the other, never both and never neither.</p>",
code:`# Swap: if a ball is here, take it; otherwise, put one down
if balls_present():
    take_ball()
else:
    put_ball()`,
logic:["When balls_present() is True, only take_ball() runs.","When it's False, only put_ball() runs.","else: lines up with if and needs its own colon."]},
{h:"Decisions inside loops",p:"<p>Combining if/else with a loop handles a whole row.</p>",
code:`# Invert a row of 6 squares
for i in range(6):
    if balls_present():
        take_ball()
    else:
        put_ball()
    if front_is_clear():
        move()`,
logic:["Each square gets checked and flipped.","The second if is separate: it runs every time.","Indentation shows which lines belong to which block."]}],
mistakes:["Putting a condition after else (else balls_present(): is an error).","Misaligned else.","Using two separate ifs when exactly one action should happen."],
check:["Can both the if body and the else body run in one pass?","No. Exactly one runs."],
quiz:[
["How many of the two blocks run in an if/else?","",["Exactly one","Both","Neither","It depends on the loop"],"if/else always chooses exactly one."],
["What is wrong?",`if front_is_clear():
    move()
else front_is_blocked():
    turn_left()`,["else can't have a condition","The if needs two colons","move() can't be inside an if","Nothing"],"else catches everything else; it takes no condition."],
["Karel is facing a wall. What happens?",`if front_is_clear():
    move()
else:
    turn_left()`,["Karel turns left","Karel moves","Karel crashes","Nothing"],"The condition is False, so else runs."],
["When should you use if/else instead of just if?","",["When one of two actions must happen","When nothing should happen if the condition is false","When repeating an action","When defining a function"],"if/else handles both outcomes."]]};

L["2.12"]={t:"While Loops in Karel",cmu:["9"],
eq:["How can we repeat code when we don't know how many times?","How do we avoid loops that never end?"],
short:["while condition: repeats as long as the condition stays True.","Use while when the number of repeats depends on the world.","The fencepost problem: you often need one more (or one fewer) action than moves."],
secs:[
{h:"Repeating until something changes",p:"<p>A while loop checks the condition before every pass. When it becomes False, the loop stops.</p>",
code:`# Move to the wall, whatever the world size
while front_is_clear():
    move()

# Pick up every ball on this square
while balls_present():
    take_ball()`,
logic:["Works in a world of any width.","Each pass must change something so the condition can eventually become False.","If the condition is False at the start, the body never runs."]},
{h:"The fencepost problem",p:"<p>To put a ball on every square of a row with 5 squares, you need 5 balls but only 4 moves. Handle the last one after the loop.</p>",
code:`while front_is_clear():
    put_ball()
    move()
put_ball()          # the last square (the extra fencepost)`,
logic:["Inside the loop: ball, move; this happens for every square except the last.","When Karel reaches the wall, the loop ends before placing the last ball.","The line after the loop places it."]}],
mistakes:["Infinite loops: e.g., while front_is_clear(): put_ball() (Karel never moves).","Missing the last square (fencepost error).","Using while where a for loop with a known count is clearer."],
check:["Why is <code>while front_is_clear(): put_ball()</code> an infinite loop?","Karel never moves, so the front stays clear forever and the condition never becomes False."],
quiz:[
["When should you use a while loop?","",["When you repeat until a condition changes","When you know the exact count","When defining a function","Only once per program"],"while depends on a condition, not a count."],
["Karel starts on a square with 2 balls. What happens?",`while balls_present():
    put_ball()`,["An infinite loop: there are always balls, so it never stops","Karel places 2 more balls and stops","Karel picks up both balls","Nothing happens"],"Putting balls down never makes balls_present() False. The body should be take_ball()."],
["Karel is in a row of 5 squares facing east at avenue 1. How many balls does this place?",`while front_is_clear():
    put_ball()
    move()`,["4","5","6","0"],"Four moves are possible, so four balls; the last square is missed (fencepost)."],
["How do you fix the fencepost problem in the previous question?","",["Add put_ball() after the loop","Add move() after the loop","Change while to if","Remove put_ball()"],"Place the final ball after the loop ends."]]};

L["2.13"]={t:"Control Structures Example",cmu:["5"],
eq:["How do loops, conditionals, and functions work together?","How do we choose the right control structure?"],
short:["Control structures: if, if/else, for, while.","Choose by asking: do I decide (if) or repeat (loop)? Known count (for) or condition (while)?","Nest them to solve real tasks."],
secs:[
{h:"Choosing a structure",p:"<table><tr><th>Question</th><th>Use</th></tr><tr><td>Do something only sometimes?</td><td><code>if</code></td></tr><tr><td>One of two things?</td><td><code>if/else</code></td></tr><tr><td>Repeat a known number of times?</td><td><code>for</code></td></tr><tr><td>Repeat until something changes?</td><td><code>while</code></td></tr></table>",
code:`# Karel walks to the wall, picking up every ball along the way
def clean_square():
    while balls_present():
        take_ball()

while front_is_clear():
    clean_square()
    move()
clean_square()          # last square`,
logic:["The outer while walks the row (unknown length).","The inner while empties each square (unknown number of balls).","The fencepost call handles the final square."]},
{h:"Nesting structures",p:"<p>Structures can go inside each other. Indentation shows the nesting.</p>",
code:`# Build towers of 3 on every other square
for i in range(4):
    if no_balls_present():
        for j in range(3):
            put_ball()
    if front_is_clear():
        move()
    if front_is_clear():
        move()`,
logic:["The inner for runs only when the if is True.","Two separate ifs make Karel skip one square safely.","Read nested code from the outside in."]}],
mistakes:["Choosing for when the count depends on the world.","Wrong indentation level in nested code.","Forgetting the fencepost after a while loop."],
check:["Which structure fits \"move until you reach a ball\"?","while no_balls_present(): move()"],
quiz:[
["Which structure fits \"put 5 balls down\"?","",["for loop","while loop","if/else","if"],"A known count calls for a for loop."],

eq:["Where can a variable be used?","What's the difference between local and global variables?"],
short:["Variables created inside a function are local: they exist only during that call.","Variables created outside functions are global.","To change a global inside a function, declare global name (use sparingly)."],
secs:[
{h:"Local scope",p:"<p>Each function call has its own space for variables. Local variables disappear when the function ends.</p>",
code:`def double_it(n):
    result = n * 2
    print(result)

double_it(5)       # 10
# print(result)    # NameError: result is local to double_it`,
logic:["result exists only inside double_it.","n (the parameter) is also local.","Two functions can use the same local name without conflict."]},
{h:"Global variables",p:"<p>A function can read a global variable, but assigning to it creates a new local one unless you say <code>global</code>.</p>",
code:`score = 0

def add_point():
    global score
    score += 1

add_point()
add_point()
print(score)     # 2

def broken():
    score += 1   # UnboundLocalError without "global score"`,
logic:["global score tells Python to use the outside variable.","Without it, Python treats score as a new local variable that hasn't been set yet.","Better practice: pass values in and return results (9.4)."]}],
mistakes:["Expecting a local variable to exist after the function ends.","Changing a global without declaring global.","Using globals everywhere instead of parameters and return values."],
check:["Can code outside a function use a variable created inside it?","No, it's local to the function."],
quiz:[
["What happens?",`def f():
    x = 5
f()
print(x)`,["NameError: x is not defined","Prints 5","Prints 0","Prints None"],"x is local to f."],
["What is printed?",`x = 10
def f():
    x = 99
f()
print(x)`,["10","99","An error","None"],"Assigning inside f creates a separate local x."],
["What does the keyword global do inside a function?","",["Lets the function change a variable defined outside it","Makes a variable constant","Deletes a variable","Creates a new function"],"It links the name to the global variable."],
["Where does a parameter exist?","",["Only inside its function","Everywhere in the program","Only before the function is called","Only in the main program"],"Parameters are local."]]};

L["9.4"]={t:"Functions and Return Values",cmu:["10"],
eq:["How does a function send a result back?","What's the difference between printing and returning?"],
short:["return sends a value back to the caller and ends the function.","The returned value can be stored, printed, or used in expressions.","A function with no return gives back None."],
secs:[
{h:"Returning values",p:"<p>Printing shows a value to the user; returning gives it to the program to use.</p>",
code:`def area(w, h):
    return w * h

a = area(3, 4)
print(a)                     # 12
print(area(2, 5) + area(1, 1))   # 11

def to_celsius(f):
    return (f - 32) * 5 / 9

print(round(to_celsius(98.6), 1))  # 37.0`,
logic:["area(3, 4) becomes 12 right where it was called.","Returned values can be combined in expressions.","Functions that return are like math functions: input → output."]},
{h:"return ends the function",p:"<p>Code after a return in the same block doesn't run. Returning from inside an if lets a function decide early.</p>",
code:`def is_even(n):
    if n % 2 == 0:
        return True
    return False

def letter(score):
    if score >= 90:
        return "A"
    if score >= 80:
        return "B"
    return "C"

print(is_even(7), letter(85))   # False B`,
logic:["As soon as a return runs, the function is done.","The final return covers every other case.","is_even could also be written: return n % 2 == 0."]}],
mistakes:["Printing inside the function when the result needs to be returned.","Forgetting to store or use the returned value.","Code after return that never runs."],
check:["What does a function return if it has no return statement?","None"],
quiz:[
["What is printed?",`def f(x):
    return x + 1
print(f(f(2)))`,["4","3","2","None"],"f(2) = 3, f(3) = 4."],
["What is printed?",`def f(x):
    print(x * 2)
y = f(5)
print(y)`,["10, then None","10, then 10","None","10"],"f prints 10 but returns None."],
["What happens after a return statement runs?","",["The function ends immediately","The next line runs","The function restarts","The program ends"],"return exits the function."],
["What is printed?",`def check(n):
    if n > 0:
        return "pos"
    return "not pos"
print(check(0))`,["not pos","pos","None","0"],"0 > 0 is False, so the second return runs."]]};

L["9.5"]={t:"Exceptions",cmu:[],
eq:["What happens when a program hits an error while running?","How can we handle errors so the program doesn't crash?"],
short:["An exception is an error that happens while the program runs (ValueError, ZeroDivisionError, TypeError…).","try: runs risky code; except: handles the error.","Use exceptions to validate user input."],
secs:[
{h:"try and except",p:"<p>If an error happens inside <code>try</code>, Python jumps to the matching <code>except</code> instead of crashing.</p>",
code:`try:
    age = int(input("Age: "))
    print("Next year:", age + 1)
except ValueError:
    print("Please enter a whole number.")`,
logic:["Typing \"fifteen\" makes int() raise a ValueError.","Instead of crashing, the except block runs.","If no error happens, except is skipped."]},
{h:"Validating input in a loop",p:"<p>Combine try/except with a loop to keep asking until the input works.</p>",
code:`while True:
    try:
        n = int(input("Divide 100 by: "))
        print(100 / n)
        break
    except ValueError:
        print("That's not a number.")
    except ZeroDivisionError:
        print("Can't divide by zero.")`,
logic:["Each kind of error gets its own message.","break runs only if everything in try succeeded.","Common exceptions: ValueError, ZeroDivisionError, TypeError, NameError, IndexError, KeyError."]}],
mistakes:["Catching every error with a bare except, hiding real bugs.","Putting too much code inside try.","Confusing syntax errors (found before running) with exceptions (during running)."],
check:["Which exception does int(\"abc\") raise?","ValueError"],
quiz:[
["Which exception does 10 / 0 raise?","",["ZeroDivisionError","ValueError","TypeError","NameError"],"Dividing by zero raises ZeroDivisionError."],
["What is printed if the user types x?",`try:
    n = int(input())
    print("ok")
except ValueError:
    print("bad")`,["bad","ok","ok then bad","An unhandled error"],"int(\"x\") fails, so except runs."],
["What does the except block do?","",["Handles an error that happened in try","Always runs","Runs before try","Ends the program"],"It runs only if a matching exception occurs."],
["Which exception does \"5\" + 5 raise?","",["TypeError","ValueError","ZeroDivisionError","IndexError"],"You can't add a str and an int."]]};

L["10.1"]={t:"Indexing",cmu:["9"],

L["10.2"]={t:"Slicing",cmu:["9"],
eq:["How can we take part of a string?","How do start, stop, and step work in a slice?"],
short:["s[start:stop] goes from start up to but not including stop.","Leaving out start means from the beginning; leaving out stop means to the end.","s[::-1] reverses a string."],
secs:[

code:`s = "Passaic County"
print(s[0:7])     # Passaic

{h:"Slices never go out of bounds",p:"<p>Unlike indexing, a slice past the end just stops at the end.</p>",

L["10.4"]={t:"Strings and For Loops",cmu:["9"],

L["10.5"]={t:"The in Keyword",cmu:["9"],

L["10.6"]={t:"String Methods",cmu:["9"],

secs:[
{h:"Common methods",p:"<table><tr><th>Method</th><th>Example → result</th></tr><tr><td><code>upper()</code></td><td>\"hi\".upper() → \"HI\"</td></tr><tr><td><code>strip()</code></td><td>\" hi \".strip() → \"hi\"</td></tr><tr><td><code>replace(a, b)</code></td><td>\"cat\".replace(\"c\", \"b\") → \"bat\"</td></tr><tr><td><code>find(x)</code></td><td>\"hello\".find(\"l\") → 2 (−1 if missing)</td></tr><tr><td><code>count(x)</code></td><td>\"hello\".count(\"l\") → 2</td></tr><tr><td><code>split()</code></td><td>\"a b c\".split() → ['a', 'b', 'c']</td></tr></table>",

L["11.1"]={t:"Project: The Game of Pig",project:true,cmu:["8"],
eq:["How do functions, loops, random numbers, and decisions combine into a full game?"],
overview:"<p>Pig is a dice game: on your turn, roll as many times as you like, adding each roll to your turn total. Roll a 1 and you lose the turn total. Choose to hold to bank your points. First to 100 wins. Students build a two-player (or player vs. computer) version.</p>",
reqs:["Use random.randint(1, 6) for dice.","Write at least two functions (for example, take_turn and computer_turn).","Use a while loop for turns and another for the whole game.","Let the player choose roll or hold with input().","Announce the winner when someone reaches 100."],
steps:["Write roll() and test it.","Write one player turn with roll/hold and the rule for rolling a 1.","Add score tracking for two players.","Wrap in a game loop until 100.","Add a simple computer strategy (hold at 20)."],
starter:`import random

def take_turn(name):
    turn_total = 0
    while True:
        roll = random.randint(1, 6)
        print(name, "rolled", roll)
        if roll == 1:
            print("Pig! Turn over.")
            return 0
        turn_total += roll
        choice = input("Turn total " + str(turn_total) + ". (r)oll or (h)old? ")
        if choice == "h":
            return turn_total

score = 0
while score < 100:
    score += take_turn("You")
    print("Score:", score)
print("You win!")`,
rubric:["Dice use random correctly","Rolling a 1 ends the turn with 0 points","Hold banks the turn total","Game ends at 100 with a winner","Uses functions with return values"]};

L["14.1"]={t:"Project: Guess the Word",project:true,cmu:["10"],
eq:["How do strings, lists, and loops come together in a complete game?"],
overview:"<p>A hangman-style game: the computer picks a secret word; the player guesses one letter at a time. Correct letters are revealed in place; the player has a limited number of wrong guesses.</p>",
reqs:["Choose a random word from a list with random.choice().","Show the word as dashes with guessed letters revealed.","Track guessed letters and don't penalize repeats.","Limit wrong guesses (for example 6) with a loop.","Announce win or loss and reveal the word."],
steps:["Write a function that builds the display string (e.g., \"-a-a-a\").","Write the guess loop.","Handle repeated and invalid guesses.","Check for win (no dashes left) and loss.","Extension: categories or a play-again loop."],
starter:`import random

words = ["python", "karel", "coding", "variable"]
secret = random.choice(words)
guessed = []
wrong = 0

def display(word, guessed):
    result = ""
    for ch in word:
        if ch in guessed:
            result += ch
        else:
            result += "-"
    return result

while wrong < 6 and "-" in display(secret, guessed):
    print(display(secret, guessed))
    g = input("Letter: ").lower()
    if g in guessed:
        print("Already guessed")
    elif g in secret:
        guessed.append(g)
    else:
        guessed.append(g)
        wrong += 1
        print("Wrong!", 6 - wrong, "left")
print("The word was", secret)`,
rubric:["Random word chosen","Display updates correctly","Repeated guesses handled","Win and loss detected","Uses at least one function with a return value"]};

];
const ids=Object.keys(L).sort((a,b)=>{const[x1,y1]=a.split(".").map(Number),[x2,y2]=b.split(".").map(Number);return x1-x2||y1-y2});

function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(src){
  const re=/("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#[^\n]*)|\b(def|if|elif|else|for|while|in|not|and|or|return|import|from|True|False|None|break|continue|try|except|with|as|pass|global|lambda|class|del|assert)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out="",last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));
    const cls=m[1]?"s":m[2]?"c":m[3]?"k":"d";out+=`<span class="${cls}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(src.slice(last));
}
function seedOf(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const looksCode=s=>/[;{}\[\]]|\w\(|==|\+=|^\d|^'|^"/.test(s);

const quizOf=(src,prefix)=>(src.quiz||[]).map((q,k)=>({stem:q[0],code:q[1],opts:q[2],expl:q[3],qid:prefix+"-"+(k+1),topic:prefix}));
const TOTAL_Q=ORDER.reduce((s,id)=>s+(L[id].quiz||[]).length,0)+CMU_IDS.reduce((s,u)=>s+CMU[u].quiz.length,0);

/* ---------- Quiz component ---------- */
let QUIZ=null;
function quizHTML(list,{group=null,showLink=false}={}){
  QUIZ={list,state:{}};
  let html=`<div class="quizbar"><span class="score" id="score"></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="showall">Show all answers</button><button class="btn" id="resetq">Reset</button></span></div><div class="qlist">`;
  let last=null;
  list.forEach((q,n)=>{
    if(group&&q.topic!==last){last=q.topic;html+=`<div class="qgroup">${group(q.topic)}</div>`}
    const order=shuffled(q.opts.length,seedOf(q.qid));
    html+=`<div class="check q mcq" data-qid="${q.qid}">
      <div class="qn"><span>Question ${n+1}</span>${showLink?`<a href="#l${q.topic}">Lesson ${q.topic}</a>`:""}</div>
      <p>${q.stem}</p>${q.code?`<pre><code>${hl(q.code)}</code></pre>`:""}
      <div class="opts" role="group" aria-label="Answer choices for question ${n+1}">${order.map((oi,k)=>`<button class="opt${looksCode(q.opts[oi])?" code":""}" data-oi="${oi}"><b>${"ABCDE"[k]}</b><span>${esc(q.opts[oi])}</span></button>`).join("")}</div>
      <div class="answer" hidden></div></div>`;
  });
  return html+`</div>`;
}
function updateScore(){
  const st=Object.values(QUIZ.state),n=QUIZ.list.length;
  const answered=st.filter(s=>s.solved).length,first=st.filter(s=>s.first===true).length;
  const el=document.getElementById("score");
  if(el)el.innerHTML=`${first} / ${n} correct on first try <small>· ${answered} of ${n} answered</small>`;
}
function reveal(card,q,msg){
  card.querySelectorAll(".opt").forEach(o=>{o.classList.remove("wrong");if(+o.dataset.oi===0)o.classList.add("right")});
  const fb=card.querySelector(".answer");fb.hidden=false;fb.innerHTML=`${msg}${esc(q.expl)}`;
}
function wireQuiz(){
  if(!document.getElementById("score"))return;
  const byId={};QUIZ.list.forEach(q=>byId[q.qid]=q);
  content.querySelectorAll(".q").forEach(card=>{
    const q=byId[card.dataset.qid];
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const s=QUIZ.state[q.qid]||(QUIZ.state[q.qid]={first:null,solved:false});
      if(s.solved)return;
      const right=+b.dataset.oi===0;
      if(s.first===null)s.first=right;
      if(right){s.solved=true;reveal(card,q,`<strong class="ok">Correct.</strong> `)}
      else{b.classList.add("wrong");const fb=card.querySelector(".answer");fb.hidden=false;fb.innerHTML=`<strong class="no">Not quite.</strong> Try another choice.`}
      updateScore();
    });
  });
  document.getElementById("showall").onclick=()=>{
    content.querySelectorAll(".q").forEach(card=>{const q=byId[card.dataset.qid];const s=QUIZ.state[q.qid]||(QUIZ.state[q.qid]={first:null,solved:false});s.solved=true;reveal(card,q,`<strong class="ok">Answer:</strong> `)});
    updateScore();
  };
  document.getElementById("resetq").onclick=()=>{const y=scrollY;route(true);scrollTo(0,y)};
  updateScore();
}

/* ---------- Navigation ---------- */
const nav=document.getElementById("nav");
function buildNav(filter=""){
  const f=filter.trim().toLowerCase();let html="",hits=0;
  html+=`<div class="navsec">CodeHS · Introduction to Python Programming</div>`;
  MODULES.forEach(m=>{
    const items=m.ids.filter(id=>!f||(id+" "+L[id].t).toLowerCase().includes(f));
    if(!items.length)return;hits+=items.length;
    const nq=m.ids.reduce((s,id)=>s+(L[id].quiz||[]).length,0);
    html+=`<div class="unit"><button aria-expanded="true">Module ${m.n} · ${m.name}<span>${m.ids.length>1?m.ids.length+" lessons":"project"}</span></button><ul>`+
      (f||!m.quiz?"":`<li><a class="uq" href="#m${m.n}" data-page="m${m.n}"><span class="n">Quiz</span>Module ${m.n} quiz · ${nq} questions</a></li>`)+
      items.map(id=>`<li><a href="#l${id}" data-id="${id}"><span class="n">${id}</span>${L[id].t}</a></li>`).join("")+`</ul></div>`;
  });
  const cm=CMU_IDS.filter(u=>!f||("unit "+u+" "+CMU[u].t+" "+CMU[u].topics.join(" ")).toLowerCase().includes(f));
  if(cm.length){hits+=cm.length;
    html+=`<div class="navsec">CMU CS Academy · CS1</div><div class="unit cmuu"><button aria-expanded="true">CS1 units<span>${CMU_IDS.length} units</span></button><ul>`+
      cm.map(u=>`<li><a href="#c${u}" data-page="c${u}"><span class="n c">U${u}</span>${CMU[u].t}</a></li>`).join("")+`</ul></div>`;}
  nav.innerHTML=hits?html:`<p class="empty">Nothing matches “${esc(filter)}”.</p>`;
  nav.querySelectorAll(".unit>button").forEach(b=>b.onclick=()=>{const ul=b.nextElementSibling;ul.hidden=!ul.hidden;b.setAttribute("aria-expanded",!ul.hidden)});
  markNav();
}
function currentPage(){const h=location.hash.slice(1);return h||"home"}
function markNav(){
  const p=currentPage();
  document.querySelectorAll("#side a").forEach(a=>{
    const on=a.dataset.id?("l"+a.dataset.id)===p:a.dataset.page===p;
    a.classList.toggle("active",on);
    if(a.dataset.id)a.classList.toggle("isdone",!!done[a.dataset.id]);
  });
  const n=ORDER.filter(id=>done[id]).length;
  document.getElementById("ptext").textContent=`${n} of ${ORDER.length} CodeHS lessons done`;
  document.getElementById("pbar").style.width=(n/ORDER.length*100)+"%";
}

    <div><b>${nLessons}</b><span>CodeHS lessons</span></div>
    <div><b>${nProj}</b><span>projects</span></div>
    <div><b>${CMU_IDS.length}</b><span>CMU CS1 units</span></div>
    <div><b>${TOTAL_Q}</b><span>practice questions</span></div>
  </div>
  <h2>CodeHS modules</h2>
  <div class="grid">${MODULES.map(m=>{const d=m.ids.filter(id=>done[id]).length;
    return `<a class="ucard" href="#l${m.ids[0]}"><span class="w">Module ${m.n}</span><strong>${m.name}</strong><span>${m.ids.length>1?m.ids.length+" lessons · "+d+" done":"Project"}</span></a>`}).join("")}</div>
  <h2>CMU CS Academy CS1 units</h2>
  <div class="grid">${CMU_IDS.map(u=>`<a class="ucard cm" href="#c${u}"><span class="w">CS1 · Unit ${u}</span><strong>${CMU[u].t}</strong><span>pairs with ${pairedLessons(u).length} CodeHS lessons</span></a>`).join("")}</div>
  <h2>How each lesson is laid out</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td class="lo">1. Essential questions</td><td>Open the lesson with the two big questions.</td></tr>
    <tr><td class="lo">2. Short notes</td><td>Three key points to remember.</td></tr>
    <tr><td class="lo">3. Full notes</td><td>Explanations with Python examples and a step-by-step “How it works”.</td></tr>
    <tr><td class="lo">4. Common mistakes</td><td>What students usually get wrong.</td></tr>
    <tr><td class="lo">5. Check yourself + quiz</td><td>One quick question, then a 4-question quiz with scoring and explanations.</td></tr>
    <tr><td class="lo">6. CMU connection</td><td>The CMU CS1 unit that teaches the same idea with graphics.</td></tr>
  </tbody></table></div>
  <h2>More CodeHS modules</h2>
  <p class="lede">The CodeHS course also has optional modules not covered here: Extra Karel Puzzles, Python Graphics (Brython or Tkinter), Projects: Who Said It? and Mastermind, Classes and Objects, Additional Topics, Python Level 1 Certification Practice, and Intro to Python with Turtle Graphics. Find them in the <a href="${CODEHS_COURSE}" target="_blank" rel="noopener">CodeHS course</a>.</p>`;
}

function renderLesson(id){
  const N=L[id];if(!N)return renderHome();
  const m=MOD_OF[id],i=ORDER.indexOf(id),prev=ORDER[i-1],next=ORDER[i+1];
  const tags=`<div class="tagrow"><a class="tag chs" href="${CODEHS_COURSE}" target="_blank" rel="noopener">Open in CodeHS ↗</a>${N.cmu.map(u=>`<a class="tag cmu" href="#c${u}">CMU CS1 · Unit ${u}</a>`).join("")}</div>`;
  let body;
  if(N.project){
    body=`<div class="eq"><span>Essential question</span>${N.eq[0]}</div>
    <h2>Overview</h2>${N.overview}
    <h2>Requirements</h2><ul class="check">${N.reqs.map(r=>`<li>${r}</li>`).join("")}</ul>
    <h2>Suggested steps</h2><ol class="notes">${N.steps.map(r=>`<li>${r}</li>`).join("")}</ol>
    <h2>Starter code</h2><div class="codehead"><span>Python</span><button class="btn" data-copy="p0">Copy code</button></div><pre id="codep0"><code>${hl(N.starter)}</code></pre>
    <h2>Scoring checklist</h2><ul class="check">${N.rubric.map(r=>`<li>${r}</li>`).join("")}</ul>`;
  }else{
    body=`<div class="eq"><span>Essential questions</span><ol>${N.eq.map(q=>`<li>${q}</li>`).join("")}</ol></div>
    <h2>Short notes</h2><ul class="notes">${N.short.map(n=>`<li>${n}</li>`).join("")}</ul>
    <h2>Full notes</h2>${notesHTML(N,"s")}
    <h2>Common mistakes</h2><ul class="notes">${N.mistakes.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${checkHTML(N.check)}
    <h2>Lesson ${id} quiz</h2>${quizHTML(quizOf(N,id))}`;
  }
  const cmuBlock=N.cmu.length?`<h2>Same idea in CMU CS Academy</h2><div class="pair">${N.cmu.map(cmuCard).join("")}</div>`
    :`<h2>CMU CS Academy</h2><p class="lede">${m.n===2?"Karel is CodeHS-only; CMU CS1 begins with drawing shapes in Unit 1.":m.n>=15?"CMU CS1 doesn't cover this topic; it's specific to the CodeHS course.":"No CMU CS1 unit focuses on this topic."} See the <a href="#cmu">CMU CS1 map</a>.</p>`;
  content.innerHTML=`<div class="crumb">CodeHS · Module ${m.n} · ${m.name}</div>
  <h1>${id} ${N.t}</h1>${tags}${body}${cmuBlock}
  <div class="foot">
    <label class="donebox"><input type="checkbox" id="donechk" ${done[id]?"checked":""}> Mark as done</label>
    <div class="pn">${prev?`<a class="btn" href="#l${prev}">← ${prev}</a>`:`<a class="btn" href="#home">← Overview</a>`}${next?`<a class="btn primary" href="#l${next}">${next} ${L[next].t.length>26?L[next].t.slice(0,24)+"…":L[next].t} →</a>`:`<a class="btn primary" href="#cmu">CMU CS1 map →</a>`}</div>
  </div>`;
  document.getElementById("donechk").onchange=e=>{done[id]=e.target.checked;save();markNav()};
  wireCopy(k=>k==="p0"?N.starter:N.secs[+k.slice(1)].code);
  wireCheck();wireQuiz();
}

function renderModuleQuiz(n){
  const m=MODULES.find(x=>x.n===n);if(!m)return renderHome();
  const list=m.ids.flatMap(id=>quizOf(L[id],id));
  content.innerHTML=`<div class="crumb">CodeHS · Module ${m.n} · ${m.name}</div>
  <h1>Module ${m.n} quiz</h1>
  <p class="lede">All ${list.length} questions from this module's lessons, grouped by lesson. Use it as review before the CodeHS <strong>${m.quiz}</strong>.</p>
  <h2>Questions</h2>${quizHTML(list,{group:id=>`${id} ${L[id].t}`,showLink:true})}`;
  wireQuiz();
}

function renderCMU(u){
  const C=CMU[u];if(!C)return renderHome();
  const k=CMU_IDS.indexOf(u),prev=CMU_IDS[k-1],next=CMU_IDS[k+1];
  const paired=pairedLessons(u);
  content.innerHTML=`<div class="crumb">CMU CS Academy · CS1</div>
  <h1>Unit ${u}: ${C.t}</h1>
  <div class="tagrow"><a class="tag cmu" href="${CMU_HOME}" target="_blank" rel="noopener">Open CMU CS Academy ↗</a>${C.topics.map(t=>`<span class="tag" style="background:var(--accent-soft);color:var(--accent)">${t}</span>`).join("")}</div>
  <div class="eq"><span>Essential questions</span><ol>${C.eq.map(q=>`<li>${q}</li>`).join("")}</ol></div>
  <h2>Short notes</h2><ul class="notes">${C.short.map(n=>`<li>${n}</li>`).join("")}</ul>
  <h2>Full notes</h2>
  <p class="src">Examples run in the CMU CS Academy editor. Outside it, start the file with <code>from cmu_graphics import *</code> and end it with <code>cmu_graphics.run()</code>.</p>
  ${notesHTML(C,"s")}
  <h2>Common mistakes</h2><ul class="notes">${C.mistakes.map(x=>`<li>${x}</li>`).join("")}</ul>
  ${checkHTML(C.check)}
  <h2>Unit ${u} quiz</h2>${quizHTML(quizOf(C,"c"+u))}
  <h2>Same ideas in CodeHS</h2>
  ${paired.length?`<div class="pair">${paired.map(lessonCard).join("")}</div>`:`<p class="lede">This unit's main ideas (events and animation) are specific to CMU's graphics.</p>`}
  <div class="foot"><span></span><div class="pn">${prev?`<a class="btn" href="#c${prev}">← Unit ${prev}</a>`:`<a class="btn" href="#cmu">← CS1 map</a>`}${next?`<a class="btn primary" href="#c${next}">Unit ${next}: ${CMU[next].t.length>24?CMU[next].t.slice(0,22)+"…":CMU[next].t} →</a>`:`<a class="btn primary" href="#home">Overview →</a>`}</div></div>`;
  wireCopy(k=>C.secs[+k.slice(1)].code);
  wireCheck();wireQuiz();
}

function renderCMUMap(){
  content.innerHTML=`<div class="crumb">CMU CS Academy · CS1</div>
  <h1>CMU CS1 map</h1>
  <p class="lede">How each CMU CS Academy CS1 unit lines up with the CodeHS lessons. Teach the CodeHS concept with console programs, then reinforce it with CMU's graphics and events.</p>
  <div class="tagrow" style="margin-top:12px"><a class="tag cmu" href="${CMU_HOME}" target="_blank" rel="noopener">Open CMU CS Academy ↗</a></div>
  <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>CMU CS1 unit</th><th>Matching CodeHS lessons</th></tr></thead><tbody>
  ${CMU_IDS.map(u=>{const p=pairedLessons(u);return `<tr><td class="lo"><a href="#c${u}">Unit ${u}</a><br>${CMU[u].t}</td><td>${p.length?p.map(id=>`<a href="#l${id}">${id} ${L[id].t}</a>`).join("<br>"):"<span style=\"color:var(--muted)\">CMU-only (graphics events)</span>"}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

function renderProjects(){
  const proj=ORDER.filter(id=>L[id].project);
  content.innerHTML=`<div class="crumb">CodeHS · Projects</div>
  <h1>Projects</h1>
  <p class="lede">The CodeHS projects in this course, each with requirements, steps, starter code, and a scoring checklist. CMU Unit 12 is the CMU creative project.</p>
  <div class="pair" style="margin-top:16px">${proj.map(lessonCard).join("")}${cmuCard("12")}</div>`;
}

function route(keep){
  const p=currentPage();
  if(p.startsWith("l"))renderLesson(p.slice(1));
  else if(/^m\d+$/.test(p))renderModuleQuiz(+p.slice(1));
  else if(/^c\d+$/.test(p))renderCMU(p.slice(1));
  else if(p==="cmu")renderCMUMap();
  else if(p==="projects")renderProjects();
  else renderHome();
  markNav();if(keep!==true)window.scrollTo(0,0);
  side.classList.remove("open");menu.setAttribute("aria-expanded","false");
}
const side=document.getElementById("side"),menu=document.getElementById("menu");
menu.onclick=()=>{const o=side.classList.toggle("open");menu.setAttribute("aria-expanded",o)};
document.getElementById("search").addEventListener("input",e=>buildNav(e.target.value));
addEventListener("hashchange",()=>route());
buildNav();route();
</script>

</body></html>
